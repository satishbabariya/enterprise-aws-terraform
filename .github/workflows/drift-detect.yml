name: Drift Detection

on:
  schedule:
    - cron: '0 2 * * *'  # 2am UTC nightly
  workflow_dispatch:

# Drift detection needs the same CI wiring as plan.yml / apply.yml: the repo
# variable MANAGEMENT_ACCOUNT_ID plus the OIDC role it points at (see
# docs/onboarding.md, "Wire CI/CD"). In a fork or template copy where that is
# not set up yet, the drift job is skipped and the run ends green with a notice
# instead of failing every night on an invalid role ARN.
permissions: {}

jobs:
  check-config:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check CI configuration
        id: check
        env:
          MANAGEMENT_ACCOUNT_ID: ${{ vars.MANAGEMENT_ACCOUNT_ID }}
        run: |
          if [ -z "$MANAGEMENT_ACCOUNT_ID" ]; then
            echo "::notice title=Drift detection skipped::drift detection skipped: no AWS role configured (set the MANAGEMENT_ACCOUNT_ID repository variable, see docs/onboarding.md)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  drift:
    needs: check-config
    if: needs.check-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        account:
          - medium/accounts/management
          - medium/accounts/log-archive
          - medium/accounts/security
          - medium/accounts/network
          - medium/accounts/shared-services
          - medium/accounts/prod
          - medium/accounts/staging
          - medium/accounts/dev
          - medium/accounts/sandbox
          - large/accounts/management
          - large/accounts/log-archive
          - large/accounts/security
          - large/accounts/network
          - large/accounts/shared-services
          - large/accounts/data-platform
          - large/accounts/security-tools
          - large/accounts/bu-alpha/prod
          - large/accounts/bu-alpha/staging
          - large/accounts/bu-alpha/dev
          - large/accounts/bu-beta/prod
          - large/accounts/bu-beta/staging
          - large/accounts/bu-beta/dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT_ID }}:role/acme-management-terraform-ci
          aws-region: us-east-1

      - name: Check for drift
        id: drift
        working-directory: ${{ matrix.account }}
        run: |
          terraform init -input=false
          set +e
          terraform plan -detailed-exitcode -no-color 2>&1 | tee drift.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Open issue if drift detected
        if: steps.drift.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const drift = fs.readFileSync('${{ matrix.account }}/drift.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Drift] ${{ matrix.account }} has unmanaged changes`,
              body: `## Terraform drift detected in \`${{ matrix.account }}\`\n\n\`\`\`\n${drift.substring(0, 65000)}\n\`\`\``,
              labels: ['terraform-drift']
            });

      - name: Fail if plan errored
        if: steps.drift.outputs.exit_code != '0' && steps.drift.outputs.exit_code != '2'
        run: |
          echo "::error title=Drift check failed::terraform plan exited with code ${{ steps.drift.outputs.exit_code }} in ${{ matrix.account }}"
          exit 1
